services:
  bot:
    build: .
    container_name: personal-agent-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg15
    container_name: personal-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: personal-agent-redis
    restart: unless-stopped
    # Not started by a plain `docker-compose up` — only with `--profile worker`.
    profiles: ["worker"]
    ports:
      - "6379:6379"

  worker:
    build: .
    container_name: personal-agent-worker
    restart: unless-stopped
    # Aspirational: requires celery/redis deps and an app/worker module that do
    # not exist yet. Kept out of the default `up` via a profile so it can't
    # crash-loop the stack. Enable with `docker-compose --profile worker up`.
    profiles: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info

  beat:
    build: .
    container_name: personal-agent-beat
    restart: unless-stopped
    profiles: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      redis:
        condition: service_started
    command: celery -A app.worker.celery_app:celery_app beat --loglevel=info

volumes:
  postgres_data:
