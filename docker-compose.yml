services:
  bot:
    build: .
    container_name: personal-agent-bot
    restart: unless-stopped
    depends_on:
      - postgres
  
  postgres:
      image: postgres:15
      container_name: personal-agent-postgres
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:latest
    container_name: personal-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    
  worker:
    build: .
    container_name: personal-agent-worker
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    command: celery -A app.worker.celery worker --loglevel=info

volumes:
  postgres_data:
